name: X402-XR1D schema verification

on:
  pull_request:
    paths:
      - 'src/x402-xr1d/**'
      - 'tests/x402-xr1d/**'
      - 'package.json'
      - '.github/workflows/x402-xr1d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xr1d-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:x402-xr1d
      - run: npm test
