name: Update Yohualli profile video

on:
  push:
    branches:
      - agent/update-yohualli-profile-video

permissions:
  contents: write

jobs:
  update-video:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-yohualli-profile-video

      - name: Update Yohualli video in Spanish and English profiles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://www.youtube.com/embed/Rv1AIlVnE6s"
          new = "https://www.youtube.com/embed/rBWNyLjg31Q"
          files = [Path("xolos-disponibles.html"), Path("en/available-xolos.html")]

          for path in files:
              text = path.read_text(encoding="utf-8")
              occurrences = text.count(old)
              if occurrences != 1:
                  raise SystemExit(f"Expected one Yohualli video URL in {path}, found {occurrences}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xolos-disponibles.html en/available-xolos.html
          git commit -m "Actualizar video de Yohualli Ramírez"
          git push origin HEAD:agent/update-yohualli-profile-video
