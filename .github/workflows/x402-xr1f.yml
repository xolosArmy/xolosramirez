name: X402-XR1F real-funds boundary verification

on:
  pull_request:
    paths:
      - 'src/x402-xr1f/**'
      - 'tests/x402-xr1f/**'
      - 'docs/specs/x402-xr1f-real-funds-boundary.md'
      - 'package.json'
      - '.github/workflows/x402-xr1f.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xr1f-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:x402-xr1f
      - run: npm run test:x402-xr1w
      - run: npm run test:x402-xr1d
      - run: npm test
