name: X402-XR1 verification

on:
  pull_request:
    paths:
      - 'src/x402-xr1/**'
      - 'tests/x402-xr1/**'
      - 'docs/specs/x402-xr1-entitlement.md'
      - 'package.json'
      - '.github/workflows/x402-xr1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xr1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:x402-xr1
      - run: npm test
