name: Remove Nox profile once

on:
  push:
    branches:
      - agent/remove-nox-delivered

permissions:
  contents: write

jobs:
  remove-nox:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-nox-delivered
          fetch-depth: 0

      - name: Remove Nox Ramírez profile cards
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = [Path('xolos-disponibles.html'), Path('en/available-xolos.html')]
          name_marker = '<h3 class="puppy-card__name">Nox Ramírez</h3>'
          article_re = re.compile(r'<article class="puppy-card"[^>]*>.*?</article>', re.DOTALL)

          for path in targets:
              text = path.read_text(encoding='utf-8')
              matches = [m for m in article_re.finditer(text) if name_marker in m.group(0)]
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly 1 Nox card, found {len(matches)}')
              m = matches[0]
              start, end = m.span()
              # Remove surrounding blank lines without touching adjacent cards.
              while start > 0 and text[start - 1] == '\n' and start > 1 and text[start - 2] == '\n':
                  start -= 1
              while end < len(text) and text[end] == '\n' and end + 1 < len(text) and text[end + 1] == '\n':
                  end += 1
              updated = text[:start] + text[end:]
              if name_marker in updated or 'data-profile="nox"' in updated or 'nox-es-reserved' in updated or 'nox-en-reserved' in updated:
                  raise SystemExit(f'{path}: Nox profile remnants remain')
              path.write_text(updated, encoding='utf-8')

          print('Removed Nox profile card from both availability pages.')

      - name: Validate diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "en/available-xolos.html xolos-disponibles.html "

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xolos-disponibles.html en/available-xolos.html
          git commit -m "Remove delivered Nox Ramírez from available xolos"
          git push origin HEAD:agent/remove-nox-delivered
