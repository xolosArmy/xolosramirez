name: Rename Iztli to Oce

on:
  push:
    branches:
      - agent/rename-iztli-to-oce
    paths:
      - .github/workflows/rename-iztli-oce.yml

permissions:
  contents: write

jobs:
  rename-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rename-iztli-to-oce
          fetch-depth: 0

      - name: Rename Iztli to Oce in Spanish and English profiles
        shell: python
        run: |
          from pathlib import Path

          files = [Path('xolos-disponibles.html'), Path('en/available-xolos.html')]
          changed = False
          for path in files:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('Iztli', 'Oce').replace('iztli', 'oce')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed = True
          if not changed:
              raise SystemExit('No Iztli references found to rename')

      - name: Commit profile rename
        shell: bash
        run: |
          git config user.name "xolosArmy automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xolos-disponibles.html en/available-xolos.html
          git commit -m "Rename Iztli Ramirez to Oce Ramirez"
          git push origin HEAD:agent/rename-iztli-to-oce
