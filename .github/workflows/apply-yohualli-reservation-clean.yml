name: Apply Yohualli reservation cleanly

on:
  push:
    branches:
      - agent/reserve-yohualli-edgar-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reserve-yohualli-edgar-clean

      - name: Update only Yohualli cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          configs = {
              Path('xolos-disponibles.html'): {
                  'marker': '<h3 class="puppy-card__name">Yohualli Ramirez</h3>',
                  'old_label': '<span class="puppy-card__status status-disponible">Disponible</span>',
                  'new_label': '<span class="puppy-card__status status-reservado">Reservada</span>\n    <span class="puppy-card__status" style="top: 40px; background-color: #ff4d4d; color: #fff;">Reservada por Edgar</span>',
                  'old_ref': 'yohualli-es-available',
                  'new_ref': 'yohualli-es-reserved',
              },
              Path('en/available-xolos.html'): {
                  'marker': '<h3 class="puppy-card__name">Yohualli Ramirez</h3>',
                  'old_label': '<span class="puppy-card__status status-disponible">Available</span>',
                  'new_label': '<span class="puppy-card__status status-reservado">Reserved</span>\n    <span class="puppy-card__status" style="top: 40px; background-color: #ff4d4d; color: #fff;">Reserved by Edgar</span>',
                  'old_ref': 'yohualli-en-available',
                  'new_ref': 'yohualli-en-reserved',
              },
          }

          for path, cfg in configs.items():
              text = path.read_text(encoding='utf-8')
              if text.count(cfg['marker']) != 1:
                  raise SystemExit(f'{path}: expected exactly one Yohualli card')
              pos = text.index(cfg['marker'])
              start = text.rfind('<article class="puppy-card"', 0, pos)
              end_pos = text.find('</article>', pos)
              if start < 0 or end_pos < 0:
                  raise SystemExit(f'{path}: unable to isolate Yohualli card')
              end = end_pos + len('</article>')
              card = text[start:end]
              required = [cfg['old_label'], cfg['old_ref'], 'data-status="available"']
              for item in required:
                  if card.count(item) != 1:
                      raise SystemExit(f'{path}: expected exactly one {item!r} inside Yohualli card')
              card = card.replace(cfg['old_label'], cfg['new_label'], 1)
              card = card.replace(cfg['old_ref'], cfg['new_ref'], 1)
              card = card.replace('data-status="available"', 'data-status="reserved"', 1)
              updated = text[:start] + card + text[end:]
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify scoped diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = [
              ('xolos-disponibles.html', 'Reservada por Edgar', 'status-reservado', 'yohualli-es-reserved'),
              ('en/available-xolos.html', 'Reserved by Edgar', 'status-reservado', 'yohualli-en-reserved'),
          ]
          marker = '<h3 class="puppy-card__name">Yohualli Ramirez</h3>'
          for filename, owner, status_class, ref in checks:
              text = Path(filename).read_text(encoding='utf-8')
              pos = text.index(marker)
              start = text.rfind('<article class="puppy-card"', 0, pos)
              end = text.find('</article>', pos) + len('</article>')
              card = text[start:end]
              assert owner in card
              assert status_class in card
              assert ref in card
              assert 'data-status="reserved"' in card
              assert 'data-status="available"' not in card
          PY

      - name: Remove temporary files and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-yohualli-reservation-clean.yml .yohualli-clean-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- xolos-disponibles.html en/available-xolos.html .github/workflows/apply-yohualli-reservation-clean.yml .yohualli-clean-trigger
          git commit -m "Mark Yohualli Ramirez reserved by Edgar"
          git push origin HEAD:agent/reserve-yohualli-edgar-clean
