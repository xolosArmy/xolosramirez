name: Reserve Iztli for Jeffrey

on:
  push:
    branches:
      - agent/reserve-iztli-jeffrey

permissions:
  contents: write

jobs:
  update-iztli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reserve-iztli-jeffrey

      - name: Update Iztli profile in both languages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              'xolos-disponibles.html': (
                  '<span class="puppy-card__status status-disponible">Disponible</span>',
                  '<span class="puppy-card__status status-disponible">Reservado</span>\n    <span class="puppy-card__status" style="top: 40px; background-color: #ff4d4d; color: #fff;">Reservado por Jeffrey</span>',
                  'iztli-es-available',
                  'iztli-es-reserved',
              ),
              'en/available-xolos.html': (
                  '<span class="puppy-card__status status-disponible">Available</span>',
                  '<span class="puppy-card__status status-disponible">Reserved</span>\n    <span class="puppy-card__status" style="top: 40px; background-color: #ff4d4d; color: #fff;">Reserved by Jeffrey</span>',
                  'iztli-en-available',
                  'iztli-en-reserved',
              ),
          }

          marker = '<h3 class="puppy-card__name">Iztli Ramirez</h3>'
          for filename, (old_status, new_status, old_ref, new_ref) in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              pos = text.index(marker)
              start = text.rfind('<article class="puppy-card"', 0, pos)
              end = text.find('</article>', pos) + len('</article>')
              block = text[start:end]
              if 'Jeffrey' not in block:
                  block = block.replace(old_status, new_status, 1)
                  block = block.replace(old_ref, new_ref, 1)
                  block = block.replace('data-status="available"', 'data-status="reserved"', 1)
                  text = text[:start] + block + text[end:]
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit HTML changes
        shell: bash
        run: |
          if git diff --quiet -- xolos-disponibles.html en/available-xolos.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xolos-disponibles.html en/available-xolos.html
          git commit -m "Mark Iztli Ramirez reserved by Jeffrey"
          git push origin HEAD:agent/reserve-iztli-jeffrey
