name: Update Xilonen profile video

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  update-video:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-xilonen-profile-video
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Xilonen video in Spanish and English profiles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://www.youtube.com/embed/-tOjo7jR67g"
          new = "https://www.youtube.com/embed/L0GKn7rXqZk"
          files = [Path("xolos-disponibles.html"), Path("en/available-xolos.html")]

          for path in files:
              text = path.read_text(encoding="utf-8")
              occurrences = text.count(old)
              if occurrences != 1:
                  raise SystemExit(f"Expected one Xilonen video URL in {path}, found {occurrences}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          Path(".github/workflows/update-xilonen-profile-video.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xolos-disponibles.html en/available-xolos.html .github/workflows/update-xilonen-profile-video.yml
          git commit -m "Actualizar video de Xilonen Ramírez"
          git push origin HEAD:agent/update-xilonen-profile-video
