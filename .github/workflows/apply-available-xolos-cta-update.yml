name: Apply available Xolos CTA update

on:
  push:
    branches:
      - fix/available-xolos-whatsapp-video-call-ctas

permissions:
  contents: write

jobs:
  update-ctas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/available-xolos-whatsapp-video-call-ctas
          fetch-depth: 0

      - name: Update CTA links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {
              Path('xolos-disponibles.html'): {
                  'lang': 'es',
                  'heading': 'commercial-info-es',
                  'video_text': 'Agendar videollamada',
                  'video_aria': 'Agendar videollamada con Xolos Ramírez',
                  'wa_text': 'Consultar por WhatsApp',
                  'wa_aria': 'Consultar por WhatsApp con Xolos Ramírez',
              },
              Path('en/available-xolos.html'): {
                  'lang': 'en',
                  'heading': 'commercial-info-en',
                  'video_text': 'Book a video call',
                  'video_aria': 'Book a video call with Xolos Ramírez',
                  'wa_text': 'Contact by WhatsApp',
                  'wa_aria': 'Contact Xolos Ramírez by WhatsApp',
              },
          }

          for path, cfg in files.items():
              text = path.read_text(encoding='utf-8')

              section_pattern = re.compile(
                  rf'(<section class="container card" aria-labelledby="{cfg["heading"]}".*?<div class="puppy-card__actions">\s*)'
                  r'<a href="mailto:[^"]+"[^>]*>.*?</a>',
                  re.S,
              )
              video_button = (
                  rf'\1<a href="https://calendar.app.google/1PXNvJM42iZ3JMHC8" '
                  rf'class="btn-small btn-primary-small cta-lead video-call-cta" target="_blank" '
                  rf'rel="noopener noreferrer" data-cta="video_call" data-lead-type="generate_lead" '
                  rf'data-lead-intent="video_call_request" data-profile="general" '
                  rf'data-page-type="available-xolos" data-lang="{cfg["lang"]}" '
                  rf'aria-label="{cfg["video_aria"]}">{cfg["video_text"]}</a>'
              )
              text, section_count = section_pattern.subn(video_button, text, count=1)
              if section_count != 1:
                  raise RuntimeError(f'Could not replace commercial-section email CTA in {path}')

              floating_pattern = re.compile(
                  r'\n\s*<a\s+href="https://calendar\.app\.google/1PXNvJM42iZ3JMHC8"\s+'
                  r'class="home-email-float video-call-float cta-lead".*?</a>',
                  re.S,
              )
              whatsapp_float = f'''

    <a
      href="https://wa.me/525518555993"
      class="home-email-float wa-float cta-lead"
      target="_blank"
      rel="noopener noreferrer"
      data-cta="whatsapp"
      data-lead-type="generate_lead"
      data-lead-intent="price_inquiry"
      data-cta-location="floating"
      data-profile="general"
      data-status="not_applicable"
      data-page-type="available-xolos"
      data-lang="{cfg['lang']}"
      aria-label="{cfg['wa_aria']}"
      title="{cfg['wa_aria']}"
    >
      <span class="home-email-float__icon" aria-hidden="true">💬</span>
      <span class="home-email-float__text">{cfg['wa_text']}</span>
    </a>'''
              text, floating_count = floating_pattern.subn(whatsapp_float, text, count=1)
              if floating_count != 1:
                  raise RuntimeError(f'Could not replace floating video CTA in {path}')

              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/apply-available-xolos-cta-update.yml')
          workflow.unlink()
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "xolosArmy automation"
          git config user.email "actions@users.noreply.github.com"
          git add xolos-disponibles.html en/available-xolos.html .github/workflows/apply-available-xolos-cta-update.yml
          git commit -m "Actualizar accesos de WhatsApp y videollamada"
          git push origin HEAD:fix/available-xolos-whatsapp-video-call-ctas
