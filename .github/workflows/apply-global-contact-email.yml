name: Apply global contact email update

on:
  push:
    branches:
      - fix/global-contact-email

permissions:
  contents: write

jobs:
  replace-email:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-contact-email
          fetch-depth: 0

      - name: Replace legacy contact email
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'contacto@xolosarmy.xyz'
          new = 'fernando@xolosramirez.com'
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(str(path))

          if not changed:
              raise SystemExit('No legacy contact email occurrences found')

          print(f'Updated {len(changed)} files:')
          print('\n'.join(changed))
          PY

      - name: Remove temporary workflow and trigger
        shell: bash
        run: |
          rm -f .github/workflows/apply-global-contact-email.yml .global-contact-email-trigger

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "xolosArmy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar correo global de contacto"
          git push origin HEAD:fix/global-contact-email
