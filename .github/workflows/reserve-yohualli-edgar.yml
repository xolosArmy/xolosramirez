name: Reserve Yohualli for Edgar

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  update-yohualli:
    if: github.event.pull_request.head.ref == 'agent/reserve-yohualli-edgar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xolosArmy/xolosramirez
          ref: agent/reserve-yohualli-edgar
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Yohualli profile in both languages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              'xolos-disponibles.html': (
                  '<span class="puppy-card__status status-disponible">Disponible</span>',
                  '<span class="puppy-card__status status-disponible">Reservada</span>\n    <span class="puppy-card__status" style="top: 40px; background-color: #ff4d4d; color: #fff;">Reservada por Edgar</span>',
                  'yohualli-es-available',
                  'yohualli-es-reserved',
              ),
              'en/available-xolos.html': (
                  '<span class="puppy-card__status status-disponible">Available</span>',
                  '<span class="puppy-card__status status-disponible">Reserved</span>\n    <span class="puppy-card__status" style="top: 40px; background-color: #ff4d4d; color: #fff;">Reserved by Edgar</span>',
                  'yohualli-en-available',
                  'yohualli-en-reserved',
              ),
          }

          marker = '<h3 class="puppy-card__name">Yohualli Ramirez</h3>'
          for filename, (old_status, new_status, old_ref, new_ref) in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(marker) != 1:
                  raise SystemExit(f'{filename}: expected exactly one Yohualli profile')
              pos = text.index(marker)
              start = text.rfind('<article class="puppy-card"', 0, pos)
              end = text.find('</article>', pos) + len('</article>')
              block = text[start:end]
              if 'Edgar' in block:
                  continue
              if old_status not in block or old_ref not in block or 'data-status="available"' not in block:
                  raise SystemExit(f'{filename}: expected available markers not found')
              block = block.replace(old_status, new_status, 1)
              block = block.replace(old_ref, new_ref, 1)
              block = block.replace('data-status="available"', 'data-status="reserved"', 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit HTML changes
        shell: bash
        run: |
          if git diff --quiet -- xolos-disponibles.html en/available-xolos.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xolos-disponibles.html en/available-xolos.html
          git commit -m "Mark Yohualli Ramirez reserved by Edgar"
          git push origin HEAD:agent/reserve-yohualli-edgar
