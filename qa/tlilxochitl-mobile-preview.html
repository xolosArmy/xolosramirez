<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile QA — Tlilxochitl</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #171717; color: #fff; font: 16px system-ui, sans-serif; }
    main { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 24px; }
    section { display: grid; gap: 8px; }
    h2 { margin: 0; font-size: 16px; text-align: center; }
    iframe { width: 390px; height: 844px; border: 1px solid #d4af37; background: #111; }
  </style>
</head>
<body>
  <main>
    <section><h2>Español · 390 × 844</h2><iframe title="Vista móvil en español" src="../xolos-disponibles.html"></iframe></section>
    <section><h2>English · 390 × 844</h2><iframe title="Mobile preview in English" src="../en/available-xolos.html"></iframe></section>
  </main>
  <script>
    document.querySelectorAll('iframe').forEach((frame) => {
      frame.addEventListener('load', () => {
        const reveal = setInterval(() => {
          const card = frame.contentDocument?.querySelector('[data-profile-card="tlilxochitl"]');
          if (!card) return;
          frame.contentWindow.scrollTo(0, Math.max(0, card.offsetTop - 100));
          clearInterval(reveal);
        }, 100);
        setTimeout(() => clearInterval(reveal), 15000);
      });
    });
  </script>
</body>
</html>
